# Shared experiment settings. Choose a model with model=<name> (conf/model/) and
# a readout head with readout=<name> (conf/readout/; each model sets its own default).
# Example: python finetune.py model=atom_jepa readout=mlp task=classification train.epochs=50
defaults:
  - _self_
  - readout: linear
  - model: atom_jepa

task: regression        # regression | classification
data: data              # Output folder of prepare_data.py
seed: 42
device: cuda

hydra:
  run:
    dir: runs/${task}/${model.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
