# @package _global_
# Baseline: Morgan count fingerprint + RDKit 2D descriptors -> LightGBM (one model per target).
# No readout head or epoch loop; boosting stops early on the validation split.
model:
  name: morgan_rdkit_lgbm
  type: lightgbm
  featurizers: [morgan, rdkit]
  morgan:
    radius: 2
    n_bits: 1024
    use_counts: true
  feature_workers: 4
  early_stopping_rounds: 200
  params:                 # Passed to LGBMRegressor / LGBMClassifier
    n_estimators: 5000
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.3
    reg_lambda: 1.0
    n_jobs: 4
